name: Release

on:
  workflow_call:
    outputs:
      released:
        description: "True if a new semantic release was published"
        value: ${{ jobs.semantic-release.outputs.released }}
      tag:
        description: "New release tag (e.g., v0.3.0)"
        value: ${{ jobs.semantic-release.outputs.tag }}
      release_sha:
        description: "Exact git commit SHA published for release"
        value: ${{ jobs.semantic-release.outputs.release_sha }}
      version:
        description: "Clean semantic version string (e.g., 0.3.0)"
        value: ${{ jobs.semantic-release.outputs.version }}

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.psr.outputs.released }}
      tag: ${{ steps.psr.outputs.tag }}
      release_sha: ${{ steps.psr.outputs.release_sha }}
      version: ${{ steps.psr.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1691ab1a129ff2d579cdd786c57209ff827aa51c # v5.1.0
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@4237147d49e61f22baa60e07b46ff3156649e9c8 # v5.4.0
        with:
          python-version: "3.12"

      - name: Run Python Semantic Release
        id: psr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Inspect version before PSR execution
          OLD_VERSION=$(uv run python -c "import tomllib; print(tomllib.loads(open('pyproject.toml', 'rb').read().decode())['project']['version'])")
          echo "Current project version: ${OLD_VERSION}"

          # Run Semantic Release versioning and publish
          # Using pinned PSR 10.7.0 as mandated by spec
          uvx python-semantic-release==10.7.0 version --print || true

          NEW_VERSION=$(uv run python -c "import tomllib; print(tomllib.loads(open('pyproject.toml', 'rb').read().decode())['project']['version'])")

          if [ "${NEW_VERSION}" != "${OLD_VERSION}" ]; then
            echo "Publishing release for version v${NEW_VERSION}..."
            uvx python-semantic-release==10.7.0 publish

            RELEASE_SHA=$(git rev-parse HEAD)
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "No version bump needed."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build & Stage Multiarch GHCR Image
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.semantic-release.outputs.release_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4480b828374123cb27647b524794 # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b4e240847c51ce1484444347 # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging multiarch image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/diaszano/postgres-mcp:sha-${{ needs.semantic-release.outputs.release_sha }}
          build-args: |
            REVISION=${{ needs.semantic-release.outputs.release_sha }}
          provenance: true
          sbom: true

  promote-image:
    name: Promote Release GHCR Aliases
    needs: [semantic-release, build-image]
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b4e240847c51ce1484444347 # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to stable tags
        run: |
          bash scripts/ci/promote_image.sh "ghcr.io/diaszano/postgres-mcp" "${{ needs.build-image.outputs.image_digest }}" "${{ needs.semantic-release.outputs.tag }}"
