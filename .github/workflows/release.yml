name: Release

on:
  workflow_call:
    outputs:
      released:
        description: "True if a new semantic release was published"
        value: ${{ jobs.semantic-release.outputs.released }}
      tag:
        description: "New release tag (e.g., v0.3.0)"
        value: ${{ jobs.semantic-release.outputs.tag }}
      release_sha:
        description: "Exact git commit SHA published for release"
        value: ${{ jobs.semantic-release.outputs.release_sha }}
      version:
        description: "Clean semantic version string (e.g., 0.3.0)"
        value: ${{ jobs.semantic-release.outputs.version }}

concurrency:
  group: image-alias-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.psr.outputs.released }}
      tag: ${{ steps.psr.outputs.tag }}
      release_sha: ${{ steps.psr.outputs.release_sha }}
      version: ${{ steps.psr.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Run Python Semantic Release
        id: psr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Inspect version before PSR execution
          OLD_VERSION=$(uv run python -c "import tomllib; print(tomllib.loads(open('pyproject.toml', 'rb').read().decode())['project']['version'])")
          echo "Current project version: ${OLD_VERSION}"

          # `version --print` returns the current version when there is no release.
          NEXT_VERSION=$(uvx python-semantic-release==10.7.0 version --print)

          if [ "${NEXT_VERSION}" = "${OLD_VERSION}" ]; then
            echo "No version bump needed."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing release for version v${NEXT_VERSION}..."
          uvx python-semantic-release==10.7.0 version

          NEW_VERSION=$(uv run python -c "import tomllib; print(tomllib.loads(open('pyproject.toml', 'rb').read().decode())['project']['version'])")
          if [ "${NEW_VERSION}" != "${NEXT_VERSION}" ]; then
            echo "Semantic Release stamped ${NEW_VERSION}, expected ${NEXT_VERSION}." >&2
            exit 1
          fi

          uvx python-semantic-release==10.7.0 publish --tag "v${NEW_VERSION}"

          RELEASE_SHA=$(git rev-parse HEAD)
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build & Stage Multiarch GHCR Image
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.semantic-release.outputs.release_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging multiarch image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/diaszano/postgres-mcp:sha-${{ needs.semantic-release.outputs.release_sha }}
          build-args: |
            REVISION=${{ needs.semantic-release.outputs.release_sha }}
            VERSION=${{ needs.semantic-release.outputs.version }}
          provenance: true
          sbom: true

  promote-image:
    name: Promote Release GHCR Aliases
    needs: [semantic-release, build-image]
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.semantic-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.76.1"
          TRIVY_SHA256="c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
          curl -sfLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm -f /tmp/trivy.tar.gz
          trivy --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to stable tags
        env:
          IMAGE_DIGEST: ${{ needs.build-image.outputs.image_digest }}
          IMAGE_TAG: ${{ needs.semantic-release.outputs.tag }}
        run: |
          bash scripts/ci/promote_image.sh "ghcr.io/diaszano/postgres-mcp" "$IMAGE_DIGEST" "$IMAGE_TAG"
