name: Build and Release Standalone Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (e.g. v0.4.2)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target_os }}_${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target_os: darwin
            target_arch: arm64
          - runner: macos-latest
            target_os: darwin
            target_arch: amd64
          - runner: ubuntu-latest
            target_os: linux
            target_arch: amd64
          - runner: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.13.7"

      - name: Set up Python
        run: |
          if [[ "${{ matrix.target_os }}" == "darwin" && "${{ matrix.target_arch }}" == "amd64" ]]; then
            arch -x86_64 uv python install 3.13
          else
            uv python install 3.13
          fi

      - name: Build standalone binary
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag || '' }}
        run: |
          if [[ -n "${TAG_NAME}" ]]; then
            export VERSION="${TAG_NAME#v}"
          fi
          bash scripts/release/build_binary.sh "${{ matrix.target_os }}" "${{ matrix.target_arch }}" "dist"

      - name: Upload binaries to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TARGET_TAG="${TAG_NAME}"
          if [[ -z "${TARGET_TAG}" ]]; then
            TARGET_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "Uploading assets to release ${TARGET_TAG}"
          gh release upload "${TARGET_TAG}" dist/*.tar.gz dist/*.sha256 --clobber

  update-tap:
    name: Update Homebrew Tap Cask
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Download release checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TARGET_TAG="${TAG_NAME}"
          if [[ -z "${TARGET_TAG}" ]]; then
            TARGET_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          mkdir -p dist
          gh release download "${TARGET_TAG}" --pattern "*.sha256" --dir dist

      - name: Generate and Update Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TARGET_TAG="${TAG_NAME}"
          if [[ -z "${TARGET_TAG}" ]]; then
            TARGET_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          VERSION="${TARGET_TAG#v}"
          python3 scripts/release/update_homebrew_tap.py --version "${VERSION}" --dist-dir dist --push
