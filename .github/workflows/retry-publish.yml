name: Retry Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing verified release tag to rebuild/publish (e.g., v0.3.0)"
        required: true
        type: string

concurrency:
  group: image-alias-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-ref:
    name: Validate Release Reference
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
    steps:
      - name: Checkout target tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate tag reference
        id: validate
        run: |
          set -euo pipefail
          python3 scripts/ci/validate_release_ref.py --tag "$TAG"

          TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          COMMIT_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$COMMIT_SHA" ]; then
            echo "Checked out commit does not match release tag ${TAG}." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

  republish-image:
    name: Republish GHCR Artifacts
    needs: validate-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout target commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-ref.outputs.commit_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.76.1"
          TRIVY_SHA256="c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
          curl -sfLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm -f /tmp/trivy.tar.gz
          trivy --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build staging multiarch image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/diaszano/postgres-mcp:sha-${{ needs.validate-ref.outputs.commit_sha }}
          build-args: |
            REVISION=${{ needs.validate-ref.outputs.commit_sha }}
            VERSION=${{ needs.validate-ref.outputs.version }}
          provenance: true
          sbom: true

      - name: Promote recovered image to stable tags
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          bash scripts/ci/promote_image.sh "ghcr.io/diaszano/postgres-mcp" "$IMAGE_DIGEST" "$IMAGE_TAG"
