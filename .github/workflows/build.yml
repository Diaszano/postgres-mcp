name: Postgres MCP CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/README.md"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Build and Sync
        run: uv sync

      - name: Run Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

  typecheck:
    name: Type Check (Pyright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Build and Sync
        run: uv sync

      - name: Run Pyright
        run: uv run pyright

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Build and Sync
        run: uv sync

      - name: Run Unit Tests
        run: uv run pytest -v tests/unit

  integration-tests:
    name: Integration Tests (PG ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["16", "17"]
        include:
          - postgres-version: "18"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Docker service
        run: sudo service docker start || true

      - name: Verify Docker is running
        run: docker info

      - name: Build HypoPG container
        run: |
          cat << 'EOF' > Dockerfile.hypopg
          ARG PG_VERSION=16
          FROM postgres:${PG_VERSION}
          RUN apt-get update && apt-get install -y --no-install-recommends postgresql-${PG_VERSION}-hypopg || true \
              && rm -rf /var/lib/apt/lists/*
          EOF
          docker build --build-arg PG_VERSION=${{ matrix.postgres-version }} -t postgres-hypopg:${{ matrix.postgres-version }} -f Dockerfile.hypopg .

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Build and Sync
        run: uv sync

      - name: Run Integration Tests
        run: |
          MULTIDB_PG_IMAGE=postgres-hypopg:${{ matrix.postgres-version }} uv run pytest -v tests/integration
